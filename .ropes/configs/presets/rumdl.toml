# Managed by Cinch. Do not edit this file: `cinch doctor --fix` rewrites it.
# To change a rule for this repository, set it under `[tools.rumdl]` in
# the Cinch config.

# The Outfitter Markdown standard for rumdl.
#
# A repository's own `.rumdl.toml` extends this file and wins over it. To
# switch off one more rule without replacing the list below, use
# `extend-disable`.

[global]
# MD013 line length: prose stays on one line per paragraph.
# MD026 trailing punctuation in headings, MD033 inline HTML, MD036 emphasis as
# a heading and MD041 first-line H1 are allowed.
disable = ["MD013", "MD026", "MD033", "MD036", "MD041"]
# Rules rumdl leaves off unless they are enabled here.
# MD070 a code block that contains a fence uses a longer fence of its own.
# MD080 heading anchors are unique. MD082 a heading has content before the
# next heading. MD085 paragraph continuation lines are not indented.
# MD087 a rumdl disable comment suppresses at least one warning.
# MD093 headings carry no emphasis or bold. MD095 link destinations hold no
# look-alike non-ASCII characters.
extend-enable = ["MD070", "MD080", "MD082", "MD085", "MD087", "MD093", "MD095"]

[MD003]
style = "atx"

[MD004]
style = "dash"

[MD007]
indent = 2

[MD024]
siblings_only = true

[MD029]
# Each list is either all `1.` or counts up. This is rumdl's default, pinned
# here on purpose.
style = "one-or-ordered"

[MD040]
# Code blocks need a language, and each language uses one alias throughout a
# document.
style = "consistent"

[MD046]
style = "fenced"

[MD049]
style = "asterisk"

[MD076]
style = "tight"
allow-loose-continuation = true

[MD080]
# Anchors are compared as GitHub renders them, for H1 to H3.
anchor-style = "github"
levels = [1, 2, 3]

[MD082]
# Every heading level is checked. A heading followed directly by its own
# subheading counts as having content.
level = 1
allow-parent-headings = true

[MD093]
# `identifier` stays allowed in a heading. Only emphasis and bold are reported.
code = false
strong = true
emphasis = true

# Fenced code is formatted by the Bun formatter, which reads the repository's
# own formatter config. `check` reports a block that is not formatted, and
# `check --fix` rewrites it.
[code-block-tools]
enabled = true
# A missing formatter is a failure, never a silent pass.
on-missing-tool-binary = "fail"
# A block the formatter fails on is reported as a warning, and the blocks
# after it are still checked. Cinch reads the warning: a block that is not
# valid code is reported as a finding, and any other failure is incomplete.
on-error = "warn"

[code-block-tools.languages]
typescript = { lint = ["bun-fmt:ts"], format = ["bun-fmt:ts"] }
tsx = { lint = ["bun-fmt:tsx"], format = ["bun-fmt:tsx"] }
javascript = { lint = ["bun-fmt"], format = ["bun-fmt"] }
jsx = { lint = ["bun-fmt:jsx"], format = ["bun-fmt:jsx"] }
